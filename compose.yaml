# Local build of the whole system (HLD "Build phases", step 1):
#   Nginx -> 2 API instances, 2 active schedulers, 2 workers, PostgreSQL, RabbitMQ, S3 storage, Mailpit.
# Run from WSL (Docker Engine lives there). Dev defaults below; put real values in .env (see deploy/env.example):
#   ./mvnw -DskipTests package && docker compose up -d --build
name: jobscheduler

x-app: &app
  image: jobscheduler-app:local
  build: .
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    storage:
      condition: service_started
  networks: [backend]

x-app-env: &app-env
  DB_URL: jdbc:postgresql://postgres:5432/jobscheduler
  DB_USER: jobscheduler
  DB_PASSWORD: ${DB_PASSWORD:-jobscheduler-dev}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USER: jobscheduler
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-jobscheduler-dev}
  STORAGE_ENDPOINT: http://storage:9000
  STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-jobscheduler}
  STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-jobscheduler-dev-secret}
  APP_JWT_SECRET: ${APP_JWT_SECRET:-change-me-local-dev-jwt-secret-0123456789abcdef}
  MAIL_HOST: mailpit
  MAIL_PORT: "1025"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jobscheduler
      POSTGRES_USER: jobscheduler
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jobscheduler-dev}
    ports: ["5437:5432"]      # non-default host port, to avoid clashing with a local Postgres
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobscheduler -d jobscheduler"]
      interval: 5s
      retries: 20
    networks: [backend]

  rabbitmq:
    image: rabbitmq:4.4.1-management-alpine   # 4.4+: quorum queues with native delayed delivery
    hostname: rabbitmq                         # stable node name, so its data survives a recreate
    environment:
      RABBITMQ_DEFAULT_USER: jobscheduler
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-jobscheduler-dev}
    ports: ["5672:5672", "15672:15672"]
    volumes: [rabbitdata:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 20
    networks: [backend]

  storage:
    image: rustfs/rustfs:1.0.6                 # S3-compatible; MinIO no longer publishes images
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-jobscheduler}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:-jobscheduler-dev-secret}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["9000:9000", "9001:9001"]
    volumes: [storagedata:/data]
    networks: [backend]

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["8125:8025"]                       # web UI with every delay alert
    networks: [backend]

  api-1: &api
    <<: *app
    environment: { <<: *app-env, SPRING_PROFILES_ACTIVE: api }
  api-2: *api

  scheduler-1: &scheduler
    <<: *app
    environment: { <<: *app-env, SPRING_PROFILES_ACTIVE: scheduler }
  scheduler-2: *scheduler

  worker-1:
    <<: *app
    hostname: worker-1
    user: root                                 # needs the Docker socket; job containers never get it
    environment: { <<: *app-env, SPRING_PROFILES_ACTIVE: worker, WORKER_CONCURRENCY: "5" }
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    stop_grace_period: 30s
  worker-2:
    <<: *app
    hostname: worker-2
    user: root
    environment: { <<: *app-env, SPRING_PROFILES_ACTIVE: worker, WORKER_CONCURRENCY: "5" }
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    stop_grace_period: 30s

  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api-1, api-2]
    restart: unless-stopped
    networks: [backend]

networks:
  backend: {}
  # Job containers are attached to jobscheduler-sandbox (created by the worker if missing):
  # a separate bridge, so scripts reach the internet but not postgres/rabbitmq/storage.

volumes:
  pgdata: {}
  rabbitdata: {}
  storagedata: {}
