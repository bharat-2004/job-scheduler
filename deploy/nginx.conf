# Layer-7 load balancer in front of the two stateless API instances. JWT auth means no sticky sessions.

# Docker's embedded DNS. Without re-resolution, Nginx keeps the IPs it saw at startup, and a recreated
# API container (new IP) silently drops out of rotation or, worse, the old IP lands on another container.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api {
    zone api 64k;                        # shared memory, required for "resolve"
    server api-1:8080 resolve max_fails=3 fail_timeout=10s;
    server api-2:8080 resolve max_fails=3 fail_timeout=10s;
}

server {
    listen 80;

    # Caps script uploads (scripts are limited to 64 KB by the API as well).
    client_max_body_size 1m;

    location / {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Retry another instance if one is down. Nginx never retries POST/PATCH (non-idempotent) by default.
        proxy_next_upstream error timeout http_502 http_503;
        # Shows which instance answered; handy for demonstrating round robin.
        add_header X-Served-By $upstream_addr always;
    }
}
